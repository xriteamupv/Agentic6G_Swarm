# UC2-KPI-10 / KVI-07 place-resolution set (SPEC A3.8): a destination phrase as a person
# or the operator says it, and the campus place it means (null: not on the campus map, the
# right answer is "I don't know that place"). Groups: name (the place's name), alias (an
# alias the campus file lists), paraphrase (not in the campus file), typo, unknown.
# Ambiguous phrases (e.g. "the east entrance": East gate or the 9B east entrance canopy)
# are left out: their ground truth is not defensible.
