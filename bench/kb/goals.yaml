# UC2-KPI-10 / KVI-07 decomposition set (SPEC A3.8): operator orders whose destination is
# said in many ways, and the tasks they must decompose into (kind, target id), order
# ignored; [] = nothing to plan (the place is not on the map: the operator is told).
# The verbs are the two the rule-based planner reads ("escort ... to", "send a robot to"),
# so with fake models the ablation isolates place resolution; with --model any verb works.
