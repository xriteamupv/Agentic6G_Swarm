[project]
name = "a6g-memory"
version = "0.1.0"
description = "SharedMemory interface and LangGraph Store stand-in."
requires-python = ">=3.11"
dependencies = [
    "a6g-common",
    "langgraph>=1.2,<2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
a6g-common = { workspace = true }

