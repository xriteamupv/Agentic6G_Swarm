[project]
name = "a6g-sim"
version = "0.1.0"
description = "Lightweight 2D fleet simulator, scenarios and fault injection."
requires-python = ">=3.11"
dependencies = [
    "a6g-common",
    "numpy>=2.0,<3",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
a6g-common = { workspace = true }

