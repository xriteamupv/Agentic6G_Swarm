[project]
name = "a6g-ros-adapter"
version = "0.1.0"
description = "ROS 2 adapter (Python 3.8-compatible, stdlib + rclpy only): JSON-lines skill primitives over a Unix socket."
# Runs under the robot's ROS Python (3.8 on the Go2/Foxy, 3.12 on the Summit/Jazzy).
# rclpy comes from the ROS install, never from PyPI, so no dependencies are declared here.
requires-python = ">=3.8"
dependencies = []

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py38"
