[project]
name = "a6g-common"
version = "0.1.0"
description = "Shared pydantic schemas, config loader, ids and clock."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13,<3",
    "pyyaml>=6.0,<7",
    "langchain-core>=1.6,<2",
    "langchain>=1.3,<2",
    "langchain-openai>=1.6,<2",
    "python-dotenv>=1.2,<2",
    "pymap3d>=3.2,<4",
    "numpy>=2.0,<3",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

