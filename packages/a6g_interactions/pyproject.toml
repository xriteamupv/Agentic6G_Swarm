[project]
name = "a6g-interactions"
version = "0.1.0"
description = "InteractionStore and guidance language: human-interaction content kept out of the twin."
requires-python = ">=3.11"
dependencies = [
    "a6g-common",
    "httpx>=0.27,<1",
    "starlette>=0.40,<2",
    "uvicorn>=0.54,<1",
]

[project.scripts]
a6g-interactions = "a6g_interactions.serve:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
a6g-common = { workspace = true }
