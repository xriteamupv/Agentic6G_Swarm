# Campus knowledge server (SPEC A3.3; stand-in for the I11 RAG tool and the I4 knowledge
# services). The stacks serve it in-process; `a6g-kb` serves it at the edge.
url: ${A6G_KB_URL:-http://127.0.0.1:8400/mcp}
resolve_min_score: 0.45      # kb_resolve_place: below this, "none" (the reply lists places)
status_ttl_min: 60           # robot status reports expire after this
status_match_radius_m: 3     # an observation this close to a node / edge / POI can set its status
walking_speed_mps: 0.8       # escort route times
use_embeddings: true         # hybrid retrieval (lexical + embeddings); false: lexical only
timeout_s: 3                 # callers fall back to word overlap past this
observation_radius_m: 25     # kb_observations_near: default radius around the pose
observation_ttl_min: 240     # observations older than this are dropped
