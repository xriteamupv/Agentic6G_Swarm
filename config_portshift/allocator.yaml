# Deterministic cost function weights (SPEC 9.1). Ties always break on lowest robot_id.
schema_version: "1.0"
weights:
  travel_time: 1.0       # per second of estimated travel + turn time
  battery: 0.5           # per % of battery consumed
  commitment: 0.3        # per second until the robot's current commitment ends
  priority: 0.2          # discount for high-priority tasks
battery_margin_pct: 5.0
default_battery_floor_pct: 20.0
unknown_battery_pct: 50.0  # used when a manifest has battery_reliable: false
recharge_resume_pct: 90.0  # low battery (floor + margin): recharge at staging until this level
recharge_idle_pct: 40.0    # an idle robot below this also recharges (too low for a patrol lap)
recharge_idle_grace_s: 10.0  # ...after waiting this long (wall clock) for the coordinator's next order
recharge_reassign_min_priority: 60  # released tasks >= this go to another robot; patrols wait
posture_priority: [emergency, interactive, routine]
non_preemptible_kinds: [escort]   # concluded via return_home/handover, never dropped
preempt_on: [emergency]           # an emergency preempts lower postures; interactive only outranks
max_rounds: 10
