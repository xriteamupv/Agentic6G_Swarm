[project]
name = "a6g-swarm"
version = "0.1.0"
description = "Agentic6G UC2 swarm robotics scaffold (robot branch, I12 / PoC10)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "a6g-interactions",
    "a6g-common",
    "a6g-ros-adapter",
    "a6g-skill-mcp",
    "a6g-allocator",
    "a6g-robot-agent",
    "a6g-coordinator",
    "a6g-transport",
    "a6g-memory",
    "a6g-observability",
    "a6g-sim",
    "a6g-cli",
    "a6g-devstack",
    "a6g-campus-tools",
    "a6g-kb",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
    "jsonschema>=4.26,<5",
    "pytest-asyncio>=1.4,<2",
    "langgraph-cli[inmem]>=0.4,<0.5",
    "pgserver>=0.1.4,<0.2",
    "a6g-coordinator[postgres]",
    "matplotlib>=3.9,<4",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
a6g-interactions = { workspace = true }
a6g-common = { workspace = true }
a6g-ros-adapter = { workspace = true }
a6g-skill-mcp = { workspace = true }
a6g-allocator = { workspace = true }
a6g-robot-agent = { workspace = true }
a6g-coordinator = { workspace = true }
a6g-transport = { workspace = true }
a6g-memory = { workspace = true }
a6g-observability = { workspace = true }
a6g-sim = { workspace = true }
a6g-cli = { workspace = true }
a6g-devstack = { workspace = true }
a6g-campus-tools = { workspace = true }
a6g-kb = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# --disable-plugin-autoload: the tests must not need ROS; a sourced ROS workspace otherwise
# injects launch_testing/ament pytest plugins through PYTHONPATH.
addopts = "-ra --strict-markers --disable-plugin-autoload -p pytest_asyncio.plugin"
markers = [
  "scenario: end-to-end scenarios on the simulated fleet (slower)",
  "gazebo: needs ROS 2 Jazzy + Gazebo + the built sim_gazebo workspace; run with --gazebo",
  "model: calls the real (cloud) models of config/models.yaml; run with --model",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
# colcon output of the ROS workspace; the chat UI (Next.js, upstream agent-chat-ui)
extend-exclude = ["sim_gazebo/build", "sim_gazebo/install", "sim_gazebo/log", "chat-ui"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
