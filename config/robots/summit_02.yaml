# Capability manifest: simulation only, fleet of 8: a copy of summit_01.
schema_version: "1.0"
robot_id: summit_02
platform: summit
capabilities: [survey, inspect, hold_post, payload, rtk_gnss]
max_speed_mps: 0.50              # assumed Nav2 max velocity configured on the Summit
footprint: {length_m: 0.73, width_m: 0.61}
turn_in_place_s_per_rad: 2.0     # rotations overshoot ~15 deg; assumed, not measured
nav_mode: action
clearance_m: 0.50                # note: rear ~96 deg is a scan blind spot (GPS mast)
localization_cov_max: 0.25
battery_reliable: false          # estimator unreliable -> allocator uses unknown_battery_pct
battery_drain_pct_per_m: 0.03
goal_tolerance: {xy_m: 0.25, yaw_rad: 0.25}
error_code_map:                  # Nav2 (Jazzy) result codes -> outcome; complete for the actions
  # in error_code_names (tests/test_error_codes.py parses the installed nav2_msgs).
  # ComputePathToPose
  200: unknown
  201: failed                    # INVALID_PLANNER
  202: tf_error
  203: no_path                   # START_OUTSIDE_MAP
  204: no_path                   # GOAL_OUTSIDE_MAP
  205: blocked                   # START_OCCUPIED
  206: no_path                   # GOAL_OCCUPIED
  207: no_path                   # TIMEOUT (planner)
  208: no_path                   # NO_VALID_PATH
  # FollowPath
  100: unknown
  101: failed                    # INVALID_CONTROLLER
  102: tf_error
  103: no_path                   # INVALID_PATH
  104: blocked                   # PATIENCE_EXCEEDED
  105: blocked                   # FAILED_TO_MAKE_PROGRESS
  106: blocked                   # NO_VALID_CONTROL (e.g. collision ahead)
  107: timeout                   # CONTROLLER_TIMED_OUT
  # Spin
  700: unknown
  701: timeout
  702: tf_error
  703: blocked                   # COLLISION_AHEAD
# Real Summit: UPV reports codes starting at x00 (e.g. 208, 700, 702), i.e. the same numbering.
forbidden_motions: []
reverse_limits:                  # rear LiDAR blind spot (GPS mast): short, slow, costmap-checked
  max_speed_mps: 0.15            # Nav2 MPPI vx_min / velocity smoother; no BackUp recovery in the BT
  max_distance_m: 0.5            # assumed for the real robot
camera_topic: /robot/front_camera/color/image_raw  # assumed
agent_host: edge_proxy           # no on-board GPU (CPU/RAM may allow on-board)
skill_timeouts:                  # sized for a ~300 m pilot sector at 0.5 m/s; assumed
  get_state: 2
  navigate_to: 900
  follow_route: 2400
  inspect: 1200
  hold_post: 3600
  return_home: 900
  cancel: 5
  stop: 3
  capture_event_image: 10
ros:
  distro: jazzy
  namespace: /robot
  map_frame: robot_map
  base_frame: robot_base_footprint
  pose_topic: /robot/amcl_pose   # only updates after motion
  scan_topic: /robot/top_3d_laser/scan
  nav_action: /robot/navigate_to_pose
  stop:
    method: zero_twist           # the ONLY raw velocity use allowed (twist_mux priority 40)
    topic: /robot/web_teleop/cmd_vel
    duration_s: 1.0
