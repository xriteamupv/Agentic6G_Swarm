# Inter-agent messaging: the interaction pattern catalogue and how each pattern
# travels. Agent code only names the pattern (it sends a message type or publishes a
# topic); the messaging layer picks the binding, encoding, compression and NL policy here.
#
# Implemented: the a2a_jsonrpc and mqtt bindings, json encoding, no compression and the
# full NL policy; the `hybrid` preset uses A2A for requests and MQTT for state, liveness
# and the kill-switch. Other presets (a2a only, mqtt only, zenoh), encodings, compression
# and NL caps are not implemented in the messaging layer.
schema_version: "1.0"

patterns:
  P1: {name: envelope dispatch, shape: request/response, typical: "per (re)allocation; 1-10 KB",
       requirement: "reliable, ack < 2 s", priority_class: 6}
  P2: {name: report, shape: inform + ack, typical: "per task or event; 0.5-5 KB",
       requirement: "reliable, ordered per robot; tolerates delay", priority_class: 5}
  P3: {name: contract-net, shape: "1->N request, N->1 replies, deadline", typical: "rare, bursty; < 2 KB",
       requirement: "complete < 1.5 s", priority_class: 6}
  P4: {name: robot state, shape: pub/sub (+ state queries), typical: "1 Hz; < 1 KB",
       requirement: "latest value; loss tolerated", priority_class: 2}
  P5: {name: liveness, shape: pub/sub + last-will, typical: "1 Hz",
       requirement: "detection < coordinator_timeout_s", priority_class: 7}
  P6: {name: escalation with evidence, shape: request/response + attachment, typical: "rare; 100-300 KB image",
       requirement: "within the negotiated uplink window", priority_class: 4}
  P7: {name: human request, shape: request/response, typical: "rare; < 2 KB",
       requirement: "user-perceived latency (TODO(UPV): target)", priority_class: 5}
  P8: {name: kill-switch, shape: broadcast, typical: rare,
       requirement: "highest priority; also the direct MCP path", priority_class: 9}
  P9: {name: network intents, shape: request/response + inform, typical: "per allocation change",
       requirement: "reliable; future (stage C5)", priority_class: 5}
  P10: {name: knowledge query, shape: request/response, typical: "< 5 KB",
        requirement: "user-perceived latency when part of a conversation (SPEC A3.12)", priority_class: 4}
  P11: {name: health report, shape: pub/sub, typical: "every 10 s and on boundary crossing",
        requirement: "self-report (NFR-A6G-07); stage E7", priority_class: 3}

preset: ${A6G_COMMS_PRESET:-hybrid}

presets:
  hybrid:
    P1: {binding: a2a_jsonrpc}
    P2: {binding: a2a_jsonrpc}
    P3: {binding: a2a_jsonrpc}
    P4: {binding: mqtt}           # state queries for explanations stay A2A requests
    P5: {binding: mqtt}
    P6: {binding: a2a_jsonrpc}
    P7: {binding: a2a_jsonrpc}
    P8: {binding: mqtt}           # plus the direct MCP stop path
    P9: {binding: a2a_jsonrpc}
    P10: {binding: mcp}           # agent -> knowledge server (MCP tool), measured by its client
    P11: {binding: mqtt}

metrics:
  path: ${A6G_COMMS_LOG:-var/comms/messages.jsonl}
