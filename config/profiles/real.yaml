# Real robots (P4b indoors, P4c campus). Anything that may receive camera images, audio or
# what people say must use an on-premises endpoint (SPEC A1 12.2, A3.5): set
# A6G_EDGE_VLM_URL / A6G_ONBOARD_VLM_URL / A6G_EMBEDDER_URL.
schema_version: "1.0"
profile: real
models:
  coordinator_llm: {cloud_allowed: true}    # text only (goals, chat); TODO(UPV): confirm policy
  edge_vlm: {cloud_allowed: false}
  onboard_vlm: {cloud_allowed: false}   # also runs converse (SPEC A3.5)
  embedder: {cloud_allowed: false}      # queried with what people say (SPEC A3.5)
timeout_scale: 1.0
robots:                        # SPEC A1 9. TODO(UPV): the robots' actual ROS_DOMAIN_IDs
  # Optional max_speed_mps per robot: may only lower the manifest's (e.g. first indoor tests).
  summit_01:
    ros_domain_id: 11
    use_sim_time: false
    localization: amcl_prior
    # Lab map -> campus_map (P4b). TODO(UPV): measured transform; identity logs a warning.
    map_to_campus: {x: 0.0, y: 0.0, yaw: 0.0}
    adapter_socket: /run/a6g/summit_01.sock
  go2_01:
    ros_domain_id: 21
    use_sim_time: false
    localization: amcl_prior
    map_to_campus: {x: 0.0, y: 0.0, yaw: 0.0}   # TODO(UPV), as above
    adapter_socket: /run/a6g/go2_01.sock
