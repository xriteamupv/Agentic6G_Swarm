# Gazebo Harmonic (a6g-gz-stack). Camera images are synthetic: cloud models allowed.
# Per robot: one ROS domain each, sim time, localization profile (the Go2s use gnss_ekf:
# their short-range 2D scan sees nothing in the open plaza),
# map_to_campus (identity: the Nav2 maps are generated in campus_map) and the spawn pose.
# Optional max_speed_mps per robot (m/s, <= 1.0): Nav2 speed, simulated platform cap and the
# speed the allocator plans with; unset = the manifest's max_speed_mps (Go2 0.30, Summit 0.50).
# Override one launch with robot.launch.py max_speed:=<m/s>.
# Read by the uv services and by the Gazebo bring-up (develop branch).
schema_version: "1.0"
profile: gazebo
timeout_scale: 2.0              # skill timeouts run on the wall clock; 3 robots run at RTF ~0.7
gnss_noise_profiles:            # applied by a6g_gz_bringup/gnss_noise_sim
  rtk: {sigma_m: 0.02}
  standard: {sigma_m: 1.5, bias_sigma_m: 2.0, bias_tau_s: 300}   # ~2.5 m total, slow bias
  degraded: {sigma_m: 4.0, bias_sigma_m: 4.0, bias_tau_s: 120, dropout_per_min: 2, dropout_s: 10}
models:
  coordinator_llm: {cloud_allowed: true}
  edge_vlm: {cloud_allowed: true}
  onboard_vlm: {cloud_allowed: true}
robots:
  summit_01:
    ros_domain_id: 11
    use_sim_time: true
    localization: gnss_ekf         # outdoors: RTK GNSS (ideal in simulation) + IMU + odometry
    spawn: {x: 0.0, y: 0.0, yaw: 0.0}
    adapter_socket: ${XDG_RUNTIME_DIR:-/tmp}/a6g/summit_01.sock
  go2_01:
    turn_rate_radps: 0.5         # in-place turns ~6 s per 180 deg (real static walk: ~30 s)
    ros_domain_id: 21
    use_sim_time: true
    localization: gnss_ekf
    spawn: {x: 0.0, y: 3.0, yaw: 0.0}
    adapter_socket: ${XDG_RUNTIME_DIR:-/tmp}/a6g/go2_01.sock
  go2_02:
    turn_rate_radps: 0.5         # in-place turns ~6 s per 180 deg (real static walk: ~30 s)
    ros_domain_id: 22
    use_sim_time: true
    localization: gnss_ekf
    spawn: {x: 0.0, y: -3.0, yaw: 0.0}
    adapter_socket: ${XDG_RUNTIME_DIR:-/tmp}/a6g/go2_02.sock
  go2_03:
    turn_rate_radps: 0.5         # in-place turns ~6 s per 180 deg (real static walk: ~30 s)
    ros_domain_id: 23
    use_sim_time: true
    localization: gnss_ekf
    spawn: {x: 0.0, y: 6.0, yaw: 0.0}
    adapter_socket: ${XDG_RUNTIME_DIR:-/tmp}/a6g/go2_03.sock
