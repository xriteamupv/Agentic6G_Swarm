# Nav2 (Jazzy) for the Go2 proxy: frames map/odom/base_link as on the dock, cmd_vel goes
# through cmd_vel_to_sport_sim (vx <= 0.30, vy = 0, wz <= 0.60; in-place yaw at the profile's
# turn_rate_radps: 0.5 rad/s in Gazebo, ~0.105 rad/s static walk on the real dock).
# Spin recovery is off by default (go2_spin_recovery: a 180 deg static-walk turn takes ~30 s),
# and the progress checker allows for slow in-place turns.
# Node keys are relative; the launch file nests them under the robot namespace, if any.
amcl:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    # The 2D scan band (-0.15..+0.30 m, sparse L1) only sees walls within ~5 m: in the open
    # plaza AMCL gets empty scans and follows leg odometry. Moderate alphas let the cloud
    # widen enough to re-converge when walls come into view (GNSS covers open areas).
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: 30.0
    laser_min_range: 0.2
    max_beams: 90
    max_particles: 2000
    min_particles: 500
    sigma_hit: 0.1          # the prior map is exact in simulation (generated from OSM)
    z_hit: 0.8
    z_max: 0.05
    z_rand: 0.2
    z_short: 0.05
    lambda_short: 0.1
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    save_pose_rate: 0.5
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.1
    set_initial_pose: true
    map_topic: map_loc  # outlines only (see map_server_loc)

map_server:
  ros__parameters:
    frame_id: map
    topic_name: map

# AMCL's map: the same footprints as outlines with unknown interiors (a6g campus build
# maps/<campus>_loc.yaml). Costmaps keep the filled map so nothing plans through buildings.
map_server_loc:
  ros__parameters:
    frame_id: map
    topic_name: map_loc

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 200  # ms; the planner on the full campus map can be slow to ack
    wait_for_service_timeout: 1000
    action_server_result_timeout: 3600.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names: [compute_path_error_code, follow_path_error_code]

controller_server:
  ros__parameters:
    odom_topic: /odom
    controller_frequency: 10.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:  # turning in place counts as progress (heading at waypoints)
      plugin: nav2_controller::PoseProgressChecker
      required_movement_angle: 0.3
      required_movement_radius: 0.3
      movement_time_allowance: 45.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15  # Gazebo (real dock: 0.25); tighter makes the static-walk Go2 dither at goals
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.30
      lookahead_dist: 0.8
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.2
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.8
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.10
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_angular_vel: 0.6
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 1.0
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.37, 0.17], [0.37, -0.17], [-0.37, -0.17], [-0.37, 0.17]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          raytrace_max_range: 6.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.2
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.55
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      resolution: 0.10  # campus-scale planning; the local costmap keeps 0.05
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.37, 0.17], [0.37, -0.17], [-0.37, -0.17], [-0.37, 0.17]]"
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          raytrace_max_range: 6.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.2
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.8
      always_send_full_costmap: false

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.105
    min_rotational_vel: 0.05
    rotational_acc_lim: 1.0

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.30, 0.0, 0.60]
    min_velocity: [-0.30, 0.0, -0.60]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
